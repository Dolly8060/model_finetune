### Qwen3-1.7B LoRA Finetune (Rigorous Split)
### Goal: translation + summarization + instruction-following

### Model
model_name_or_path: D:/AI_code/models/Qwen3-1.7B
trust_remote_code: true

### Finetune method
stage: sft
do_train: true
finetuning_type: lora

### Dataset
# Built by scripts/build_qwen3_rigorous_dataset.py
dataset_dir: ./data
dataset: qwen3_rigorous_train
eval_dataset: qwen3_rigorous_val
template: qwen3
cutoff_len: 2048
max_samples: 20000
overwrite_cache: true
preprocessing_num_workers: 2

### LoRA
lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### Training
output_dir: ./outputs/qwen3-1.7B-lora-rigorous
logging_steps: 10
save_steps: 200
save_total_limit: 5
resume_from_checkpoint: false

### Batch size
per_device_train_batch_size: 2
gradient_accumulation_steps: 8

### Learning rate
learning_rate: 8.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
weight_decay: 0.01

### Optimizer
optim: adamw_torch

### Evaluation
eval_strategy: steps
eval_steps: 200
per_device_eval_batch_size: 4
load_best_model_at_end: true
metric_for_best_model: eval_loss

### Other
report_to: none
